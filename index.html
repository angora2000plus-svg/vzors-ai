<!DOCTYPE html>
<html lang="lv">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vzors</title>
<style>body{margin:0;padding:24px;background:#f8f7ff;font-family:sans-serif}
.top{font-size:32px;font-weight:800} .card{background:#fff;border:1px solid #e9e3ff;border-radius:16px;padding:16px;margin-top:16px}
textarea{width:100%;border:1px solid #e9e3ff;border-radius:12px;padding:12px;box-sizing:border-box}
button{background:#111;color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}</style>
</head>
<body>
<div class="top">✦ Vzors</div>
<div class="card">
<textarea id="t" placeholder="Raksti vai nodiktē..."></textarea><br><br>
<button id="b" onclick="mic()">🎤 Nodiktēt</button>
<button onclick="save()">+ Lapiņa</button>
<div id="list" style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"></div>
</div>
<div class="card" onclick="alert('Kalendārs: 8. nov - Tēva diena')">📅 Kalendārs • spied</div>
<div class="card">🧩 YouTube • Edit Hub • GitHub • Delfi</div>
<script>
function render(){let a=JSON.parse(localStorage.getItem('v')||'[]');let l=document.getElementById('list');l.innerHTML='';a.forEach(x=>{let d=document.createElement('div');d.style.background='#fffbe6';d.style.border='1px solid #f0e6b0';d.style.borderRadius='12px';d.style.padding='12px';d.textContent=x;l.appendChild(d)})}
function save(){let v=document.getElementById('t').value;if(!v)return;let a=JSON.parse(localStorage.getItem('v')||'[]');a.unshift(v);localStorage.setItem('v',JSON.stringify(a));document.getElementById('t').value='';render()}
function mic(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new R();r.lang='lv-LV';r.onstart=()=>document.getElementById('b').innerText='🔴 Klausos';r.onend=()=>document.getElementById('b').innerText='🎤 Nodiktēt';r.onresult=e=>document.getElementById('t').value=e.results[0][0].transcript;r.start()}
render()
</script>
</body>
</html>
