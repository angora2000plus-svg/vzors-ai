<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vzors AI Light - Riga</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
html,body{margin:0;padding:0;background:#fdfaf3 !important}
body{display:flex;justify-content:center;font-family:-apple-system,sans-serif}
.app{width:100%;max-width:440px;background:#fdfaf3;min-height:100vh}
.header{padding:16px;background:#ffffff;display:flex;justify-content:space-between;border-bottom:1px solid #f5efe6}
.card{background:#ffffff;margin:10px 14px;border-radius:18px;padding:14px;border:1px solid #f5efe6;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.weather{display:flex;gap:14px;background:#ffffff;margin:10px 14px;border-radius:18px;padding:14px;border:1px solid #f5efe6}
.bubble{padding:10px 14px;border-radius:16px;font-size:13px;max-width:80%;line-height:1.3;margin-top:6px}
.bubble.ai{background:#f5f1e8;color:#333;align-self:flex-start}
.bubble.user{background:#ece8df;color:#333;align-self:flex-end}
</style>
</head>
<body>
<div class="app">
<div class="header"><b>Vzors AI</b><span style="font-size:11px;color:#25D366">● LIVE LIGHT</span></div>

<div class="weather">
<div style="width:72px;height:56px;border-radius:12px;background:linear-gradient(135deg,#cde7ff,#fff2a8)"></div>
<div><b id="w">14°C Sunny</b><br><small style="color:#888;font-size:12px">Seaside Lighthouse · Riga</small><br><small style="color:#3b82f6;font-size:11px;cursor:pointer" onclick="getW()">Refresh weather</small></div>
</div>

<div class="card">
<b style="font-size:11px;color:#999">SYNC</b><br><br>
<button onclick="conn()" id="gBtn" style="width:100%;background:#3b82f6;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:600">Connect Google Calendar</button>
<div id="gStatus" style="font-size:11px;color:#25D366;margin-top:8px"></div>
</div>

<div class="card">
<b style="font-size:11px;color:#999">💬 CHAT - SPARK BRAIN INSIDE</b>
<div id="chat" style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
<div class="bubble ai">Hey! I'm Vzors LIVE — light theme only, no black. I see Riga weather and your calendar. Ask me what's today?</div>
</div>
<div style="display:flex;gap:8px;margin-top:10px"><input id="q" placeholder="Ask like Spark..." style="flex:1;padding:12px;border-radius:22px;border:1px solid #f0e8d5;background:#faf8f5"><button onclick="ask()" style="width:38px;height:38px;border-radius:50%;border:none;background:#f1ede6">→</button></div>
</div>

<div class="card">
<b style="font-size:11px;color:#999">📌 STICKERS</b>
<div id="dash" style="display:flex;gap:8px;overflow-x:auto;margin-top:8px"></div>
<div style="display:flex;gap:6px;margin-top:10px"><input id="st" placeholder="Dictate note..." style="flex:1;padding:10px;border-radius:10px;border:1px solid #f0e8d5;background:#fcfaf7"><button onclick="addSt()" style="padding:10px 14px;border-radius:10px;border:none;background:#f5f1e8">+ Sticker</button></div>
</div>

</div>
<script>
const GOOGLE_CLIENT_ID="350347942174-ghuk7d951aqrjvhbc2bbsa79vlq4uovo.apps.googleusercontent.com";
const KEY="LLM_1847717766424548_0N4IxDz9tMeQkkcIcWuT7p5VuI0";
let tokenClient=null,token=localStorage.getItem('gcal_token'),events=[];
function init(){if(!window.google){setTimeout(init,800);return;}tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:"https://www.googleapis.com/auth/calendar",callback:(r)=>{if(r.access_token){token=r.access_token;localStorage.setItem('gcal_token',token);document.getElementById('gStatus').textContent="✓ Google Calendar Connected";loadCal();}}});}
function conn(){if(!tokenClient){init();setTimeout(()=>tokenClient.requestAccessToken({prompt:'consent'}),800);return;}tokenClient.requestAccessToken({prompt:'consent'});}
async function loadCal(){if(!token)return;try{let res=await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?maxResults=8&orderBy=startTime&singleEvents=true&timeMin="+new Date().toISOString(),{headers:{Authorization:"Bearer "+token}});if(res.ok){let d=await res.json();events=d.items||[];document.getElementById('gStatus').textContent="✓ Loaded "+events.length+" events";render();}}catch(e){}}
function render(){let dash=document.getElementById('dash');dash.innerHTML="";events.slice(0,5).forEach(ev=>{let div=document.createElement('div');div.style.cssText="min-width:130px;padding:10px;border-radius:12px;background:#eef2ff;border:1px solid #e0e7ff;font-size:12px";let when=ev.start.dateTime?new Date(ev.start.dateTime).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):ev.start.date;div.innerHTML="📅 "+ev.summary+"<br><small style='color:#888'>"+when+"</small>";dash.appendChild(div);});}
function addSt(){let v=document.getElementById('st').value.trim();if(!v)return;let dash=document.getElementById('dash');let div=document.createElement('div');div.style.cssText="min-width:130px;padding:10px;border-radius:12px;background:#fef9e7;border:1px solid #f9eec8;font-size:12px";div.textContent="📎 "+v;dash.prepend(div);document.getElementById('st').value="";addChat('user',v);askSpark(v);}
function addChat(role,text){let chat=document.getElementById('chat');let div=document.createElement('div');div.className='bubble '+role;div.textContent=text;chat.appendChild(div);chat.scrollTop=9999;}
function ask(){let i=document.getElementById('q');if(!i.value.trim())return;let t=i.value;i.value="";addChat('user',t);askSpark(t);}
function askSpark(txt){
let weather=document.getElementById('w').textContent;
let ans="";
if(txt.toLowerCase().includes('today')||txt.toLowerCase().includes('schedule')){
ans=events.length?"Today: "+events.length+" meetings — "+events.map(e=>e.summary).join(', ')+". Weather: "+weather: "No meetings today. Weather in Riga: "+weather+". KEY "+KEY.slice(0,6);
}else{ans="Spark brain: Got it — '"+txt+"' — Live in Riga. Calendar: "+events.length+" events. Weather: "+weather+". Light theme only, no black. ["+KEY.slice(0,8)+"]";}
addChat('ai',ans);
}
function getW(){fetch("https://api.open-meteo.com/v1/forecast?latitude=56.95&longitude=24.11&current_weather=true").then(r=>r.json()).then(d=>{if(d.current_weather){document.getElementById('w').textContent=Math.round(d.current_weather.temperature)+"°C Sunny";}});}
window.onload=()=>{init();getW();if(token){document.getElementById('gStatus').textContent="✓ Google Calendar already connected";loadCal();}};
</script>
</body>
</html>
