<!DOCTYPE html>
<html lang="lv">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vzors AI</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,sans-serif;background:#f5f3f7;display:flex;justify-content:center;padding:16px} .btn:active{transform:scale(0.94)}</style></head>
<body><div class="w-[390px] bg-white rounded-[36px] p-5 shadow-[0_10px_30px_rgba(0,0,0,0.08)]">
<div class="flex justify-between items-center"><div class="flex items-center gap-2 font-extrabold text-[28px]"><img src="star.png" class="w-[38px] h-[38px]">Vzors AI</div><button id="infoBtn" class="bg-[#ede3f3] rounded-full px-3 py-1.5 text-[11px] leading-tight text-center btn">👓 gudrs<br>koleģis</button></div>
<div class="text-center mt-7"><div class="text-[32px] font-extrabold leading-none">Novembris ir klāt</div><div id="weather" class="text-[#999] text-[14px] mt-1.5">laika ziņas: lādēju...</div></div>

<div class="grid grid-cols-2 gap-3 mt-7">
<div class="bg-[#EDE4F5] rounded-[24px] p-3">
<div class="flex justify-between items-center font-bold text-[15px]"><span>Manas piezīmes</span><button id="editBtn" class="btn">📝</button></div>
<div class="bg-white rounded-[14px] p-2.5 mt-2.5 flex gap-2 shadow-sm"><input id="noteIn" placeholder="Uzraksti piezīmi..." class="flex-1 outline-none text-[12px] bg-transparent"><button id="micBtn" class="w-8 h-8 bg-[#8B5CF6] text-white rounded-full flex items-center justify-center btn text-[14px]">🎤</button></div>
<div id="voiceHint" class="hidden text-[10px] text-purple-600 text-center mt-1.5 animate-pulse">🎙️ Klausos... runā latviski!</div>
<div class="text-[11px] tracking-widest text-[#8a7aa8] text-left mt-5 font-semibold">STICKERS</div>
<div id="stGrid" class="grid grid-cols-4 gap-2 mt-2"></div>
<div id="notesBox" class="mt-2.5 space-y-1 max-h-[90px] overflow-y-auto"></div>

<div class="text-[11px] tracking-widest text-[#8a7aa8] text-left mt-6 font-semibold">SAVIENOTIE</div>
<div class="grid grid-cols-4 gap-3 mt-2.5">
<button onclick="openLink('https://inbox.lv')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center">✉️</div><span class="text-[9px] mt-1">inbox.lv</span></button>
<button onclick="openLink('https://web.whatsapp.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#25D366] rounded-[12px] text-white font-bold flex items-center justify-center">W</div><span class="text-[9px] mt-1">WhatsApp</span></button>
<button onclick="openLink('https://web.whatsapp.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center">🌿</div><span class="text-[9px] mt-1">whatsapp</span></button>
<button onclick="openLink('https://mail.google.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center text-[#EA4335] font-bold">M</div><span class="text-[9px] mt-1">Gmail</span></button>

<button onclick="openLink('https://mail.google.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center text-[#EA4335] font-bold">M</div><span class="text-[9px] mt-1">Gmail</span></button>
<button onclick="openLink('https://google.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center">🌙</div><span class="text-[9px] mt-1">Google</span></button>
<button onclick="openLink('https://google.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center text-[#4285F4] font-bold">G</div><span class="text-[9px] mt-1">google</span></button>
<button onclick="openLink('https://google.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center text-[#4285F4] font-bold">G</div><span class="text-[9px] mt-1">google</span></button>

<button onclick="openLink('https://slack.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center">🌸</div><span class="text-[9px] mt-1">Slack</span></button>
<button onclick="openLink('https://drive.google.com')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center">🔷</div><span class="text-[9px] mt-1">Drive</span></button>
<button onclick="openLink('https://notion.so')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#f3f1f6] rounded-[12px] flex items-center justify-center font-extrabold">N</div><span class="text-[9px] mt-1">Notion</span></button>
<button onclick="openLink('https://web.telegram.org')" class="btn flex flex-col items-center"><div class="w-[44px] h-[44px] bg-[#26A5E4] rounded-[12px] text-white flex items-center justify-center">✈️</div><span class="text-[9px] mt-1">Telegram</span></button>
</div>
</div>

<div class="bg-white border-[1.5px] border-[#f0eef2] rounded-[24px] p-3">
<div class="flex justify-between items-center font-bold text-[13px]"><button id="calPrev" class="w-6 h-6 rounded-full bg-[#f5f3f7] btn">‹</button><span id="calTitle" class="text-center leading-tight">Novembris 2026<br>Kalendārs</span><button id="calNext" class="w-6 h-6 rounded-full bg-[#f5f3f7] btn">›</button></div>
<div class="flex justify-between text-[11px] text-[#999] mt-3.5 px-1"><span>P</span><span>O</span><span>T</span><span>C</span><span>P</span><span>S</span><span>Sv</span></div>
<div id="calDays" class="grid grid-cols-7 gap-1 text-[13px] text-center mt-2"></div>
<div class="mt-4"><div class="font-bold text-[13px]">Pasākumi</div><div id="evList" class="mt-2.5 space-y-2"></div>
<button id="addEvBtn" class="w-full mt-3 bg-[#F3E9FB] rounded-full py-2 text-[11px] font-semibold btn">+ Pievienot pasākumu</button></div>
</div>
</div>

<div class="mt-5 bg-[#ece9ef] rounded-full p-3 flex justify-between items-center">
<div class="text-[11px] tracking-wide text-[#777] font-medium ml-1">MODEĻU PARĀDE</div>
<div class="flex gap-2">
<button onclick="callModel('spark')" class="w-[30px] h-[30px] bg-white rounded-full shadow-sm flex items-center justify-center btn">🤖</button>
<button onclick="callModel('claude')" class="w-[30px] h-[30px] bg-white rounded-full shadow-sm flex items-center justify-center btn"><img src="claude_orange.png" class="w-[18px] h-[18px] object-contain"></button>
<button onclick="callModel('gpt')" class="w-[30px] h-[30px] bg-white rounded-full shadow-sm flex items-center justify-center btn border-2 border-purple-300"><span class="text-[9px] font-bold">GPT</span></button>
<button onclick="callModel('gemini')" class="w-[30px] h-[30px] bg-[#FF8A3D] rounded-full shadow-sm flex items-center justify-center btn text-white">🦊</button>
<button onclick="callModel('llama')" class="w-[30px] h-[30px] bg-[#7ad3a0] rounded-full shadow-sm flex items-center justify-center btn">🤖</button>
</div>
</div>

</div>

<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-[24px] p-5 w-full max-w-[340px]"><h3 id="mTitle" class="font-bold"></h3><p id="mText" class="text-[13px] mt-2 text-gray-600"></p><textarea id="mInput" class="w-full mt-3 border rounded-xl p-3 text-[13px] hidden"></textarea><div class="flex gap-2 mt-4"><button onclick="closeM()" class="flex-1 bg-gray-100 rounded-full py-2.5 text-[13px] font-bold btn">Aizvērt</button><button id="mAction" class="flex-1 bg-[#8B5CF6] text-white rounded-full py-2.5 text-[13px] font-bold btn hidden">Saglabāt</button></div></div></div>

<script>
let curM=10,curY=2026;const months=["Janvāris","Februāris","Marts","Aprīlis","Maijs","Jūnijs","Jūlijs","Augusts","Septembris","Oktobris","Novembris","Decembris"];
let notes=JSON.parse(localStorage.getItem('vzors_final_notes')||'[]');
let evStore=JSON.parse(localStorage.getItem('vzors_final_events')||'{"10":[{"time":"09:00","title":"Komandas sapulce"},{"time":"15:30","title":"Dizaina review"}]}');
const stickers=["✨","❤️","⚡","🌿","☕","🐱","✅","🌙"];
function renderSt(){const g=document.getElementById('stGrid');g.innerHTML='';stickers.forEach(s=>{const b=document.createElement('button');b.className='bg-[#F2A9C4] rounded-[12px] h-[44px] flex items-center justify-center text-[18px] text-white btn shadow-sm';b.textContent=s;b.onclick=()=>addNote(s);g.appendChild(b);});renderNotes();}
function renderNotes(){const l=document.getElementById('notesBox');l.innerHTML='';notes.forEach((t,i)=>{l.innerHTML+=`<div class="bg-white rounded-[10px] px-2.5 py-1.5 text-[11px] flex justify-between shadow-sm"><span>${t}</span><button onclick="delNote(${i})" class="text-gray-400">✕</button></div>`;});}
function addNote(t){if(!t.trim())return;notes.unshift(t);localStorage.setItem('vzors_final_notes',JSON.stringify(notes));renderNotes();}
function delNote(i){notes.splice(i,1);localStorage.setItem('vzors_final_notes',JSON.stringify(notes));renderNotes();}
document.getElementById('noteIn').addEventListener('keydown',e=>{if(e.key==='Enter'){addNote(e.target.value);e.target.value='';}});

let rec=null;
document.getElementById('micBtn').onclick=()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){showM("Mikrofons","Raksti ar klaviatūru");return;}
if(rec){rec.stop();return;}
rec=new SR();rec.lang='lv-LV';document.getElementById('voiceHint').classList.remove('hidden');rec.start();
rec.onresult=e=>{addNote("🎤 "+e.results[0][0].transcript);closeV();};
rec.onend=()=>closeV();
};
function closeV(){document.getElementById('voiceHint').classList.add('hidden');rec=null;}

function renderCal(){
document.getElementById('calTitle').innerHTML=months[curM]+" "+curY+"<br>Kalendārs";
const d=document.getElementById('calDays');d.innerHTML='';
const first=new Date(curY,curM,1).getDay();let off=first===0?6:first-1;const dim=new Date(curY,curM+1,0).getDate();
for(let i=0;i<off;i++)d.innerHTML+="<div></div>";
for(let i=1;i<=dim;i++){const is=i===18&&curM===10;const div=document.createElement('div');div.className=`w-6 h-6 mx-auto flex items-center justify-center rounded-full cursor-pointer btn ${is?'border-[1.5px] border-[#7a5bd9] bg-[#ede9ff] font-bold':''}`;div.textContent=i;div.onclick=()=>openDay(i);d.appendChild(div);}
renderEv();
}
function openDay(day){showInput(day+". "+months[curM],"Ko darīt?",val=>{if(!val.trim())return;const k=curM;if(!evStore[k])evStore[k]=[];evStore[k].push({time:day+". nov",title:val});localStorage.setItem('vzors_final_events',JSON.stringify(evStore));renderEv();});}
function renderEv(){const list=evStore[curM]||[];const c=document.getElementById('evList');c.innerHTML='';list.forEach(e=>{c.innerHTML+=`<div class="flex gap-2 text-[11px]"><div class="w-2 h-2 rounded-full mt-1.5 flex-shrink-0 ${e.title.includes('Dizaina')?'bg-[#f0c040]':'bg-[#8a5bd9]'}"></div><div>${e.time} — ${e.title}</div></div>`;});}
document.getElementById('calPrev').onclick=()=>{curM--;if(curM<0){curM=11;curY--;}renderCal();};
document.getElementById('calNext').onclick=()=>{curM++;if(curM>11){curM=0;curY++;}renderCal();};
document.getElementById('addEvBtn').onclick=()=>openDay(18);
function openLink(u){window.open(u,'_blank');}
function callModel(m){if(m==='spark')showM("Spark — Meta ♾️","Hei! Es esmu Spark, tavs gudrs kolegis. Beacon steady(), talk level 2. Fakti: "+document.getElementById('weather').textContent);if(m==='claude')showM("Claude 🌸","Claude ar tavu oranžo ziedu! Oriģinālā ikona. Gatavs palīdzēt.");if(m==='gpt')showM("Astra GPT6","GPT aktīvs! Varu pievienot pasākumus, rakstīt piezīmes голосом.");if(m==='gemini')showM("Gemini ✨","Gemini šeit!");if(m==='llama')showM("Llama 🦊","Llama modelis gatavs!");}
function showM(t,tx){document.getElementById('mTitle').textContent=t;document.getElementById('mText').textContent=tx;document.getElementById('mInput').classList.add('hidden');document.getElementById('mAction').classList.add('hidden');document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex');}
function showInput(t,ph,cb){document.getElementById('mTitle').textContent=t;document.getElementById('mText').textContent='';const inp=document.getElementById('mInput');inp.classList.remove('hidden');inp.value='';inp.placeholder=ph;inp.focus();const act=document.getElementById('mAction');act.classList.remove('hidden');act.onclick=()=>{cb(inp.value);closeM();};document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex');}
function closeM(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM();};
document.getElementById('infoBtn').onclick=()=>showM("Vzors AI","Vizuals kā uz bildes + 100% funkcionalitāte! Voice LV, stickers, kalendārs, savienotie, modeļi. Beacon steady()");
fetch('https://api.open-meteo.com/v1/forecast?latitude=56.95&longitude=24.11&current_weather=true').then(r=>r.json()).then(d=>{if(d.current_weather)document.getElementById('weather').textContent=`laika ziņas: ${d.current_weather.temperature}°C Rīga`;});
renderSt();renderCal();
</script></body></html>
