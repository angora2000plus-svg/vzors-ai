<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vzors AI - Salon CRM + Real GCal</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{
margin:0;
padding:0;
background:#0a0a0a;
color:#fff;
font-family:-apple-system,sans-serif;
}
.header{
padding:16px 20px;
display:flex;
flex-direction:column;
gap:6px;
border-bottom:1px solid #222;
position:sticky;
top:0;
background:#0a0a0a;
z-index:10;
}
#sync{
font-size:13px;
color:#888;
display:flex;
align-items:center;
gap:8px;
}
#uin{
font-size:11px;
color:#555;
word-break:break-all;
}
.tabs{
display:flex;
gap:8px;
padding:12px 20px;
border-bottom:1px solid #1a1a1a;
overflow-x:auto;
}
.tab{
padding:8px 16px;
background:#1a1a1a;
border-radius:20px;
font-size:13px;
white-space:nowrap;
cursor:pointer;
border:none;
color:#888;
}
.tab.active{
background:#fff;
color:#000;
}
.content{
padding:20px;
}
.card{
background:#141414;
border:1px solid #222;
border-radius:12px;
padding:16px;
margin-bottom:12px;
}
.btn{
background:#fff;
color:#000;
border:none;
padding:12px 20px;
border-radius:8px;
font-weight:600;
cursor:pointer;
width:100%;
font-size:14px;
}
.btn-secondary{
background:#1a1a1a;
color:#fff;
border:1px solid #333;
}
input,select,textarea{
width:100%;
background:#1a1a1a;
border:1px solid #333;
color:#fff;
padding:12px;
border-radius:8px;
font-size:14px;
box-sizing:border-box;
margin-bottom:10px;
}
label{
font-size:12px;
color:#888;
margin-bottom:6px;
display:block;
}
.row{
display:flex;
gap:10px;
}
.status-dot{
width:8px;
height:8px;
border-radius:50%;
background:#888;
display:inline-block;
}
</style>
</head>
<body>
<div class="header">
<div id="sync">
<span class="status-dot" id="dot">
</span>
<span id="syncText">
SYNC Checking...
</span>
</div>
<div id="uin">
Not connected
</div>
</div>
<div class="tabs">
<button class="tab active" data-tab="today">
Сегодня
</button>
<button class="tab" data-tab="clients">
Клиенты
</button>
<button class="tab" data-tab="calendar">
Календарь
</button>
<button class="tab" data-tab="settings">
Настройки
</button>
</div>
<div class="content" id="tab-today">
<div class="card">
<h3 style="margin:0 0 8px 0;">
Сегодня
</h3>
<p style="color:#666;font-size:13px;margin:0;">
Записей: <span id="todayCount">0</span>
</p>
</div>
<div id="todayList">
</div>
</div>
<div class="content" id="tab-clients" style="display:none;">
<div class="card">
<h3>
Добавить клиента
</h3>
<label>
Имя
</label>
<input id="clientName" placeholder="Имя клиента">
<label>
Телефон
</label>
<input id="clientPhone" placeholder="+371...">
<label>
Услуга
</label>
<select id="clientService">
<option>
Стрижка
</option>
<option>
Окрашивание
</option>
<option>
Маникюр
</option>
<option>
Брови
</option>
<option>
Лазер
</option>
</select>
<button class="btn" onclick="addClient()">
Добавить
</button>
</div>
<div id="clientsList">
</div>
</div>
<div class="content" id="tab-calendar" style="display:none;">
<div class="card">
<h3 style="margin-top:0;">
Google Calendar Sync
</h3>
<p style="color:#888;font-size:13px;">
Подключи чтобы записи уходили в Google Календарь
</p>
<button class="btn" id="authBtn">
Connect Google Calendar
</button>
<div id="status" style="margin-top:12px;font-size:12px;color:#666;">
</div>
</div>
<div class="card">
<h3>
Создать запись
</h3>
<label>
Дата
</label>
<input type="date" id="eventDate">
<label>
Время
</label>
<input type="time" id="eventTime">
<label>
Клиент
</label>
<input id="eventClient" placeholder="Имя">
<button class="btn btn-secondary" onclick="createEvent()">
Создать в Google Calendar
</button>
</div>
</div>
<div class="content" id="tab-settings" style="display:none;">
<div class="card">
<h3>
Настройки
</h3>
<label>
Твое имя
</label>
<input id="myName" placeholder="Мастер">
<label>
Телефон
</label>
<input id="myPhone" placeholder="+371...">
<button class="btn" onclick="saveSettings()">
Сохранить
</button>
</div>
<div class="card">
<p style="font-size:11px;color:#444;word-break:break-all;">
Client ID: 350347942174-ghuk7d951aqrjvhbc2bbsa79vlq4uovo
<br>
Project: future-lane-440620-f2
</p>
</div>
</div>
<script>
const GOOGLE_CLIENT_ID=
"350347942174-ghuk7d951aqrjvhbc2bbsa79vlq4uovo.apps.googleusercontent.com";
const KEY=
"LLM_1847717766424548_0N4IxDz9tMeQkkcIcWuT7p5VuI0";
const SCOPES=
"https://www.googleapis.com/auth/calendar";
let DB=
JSON.parse(
localStorage.getItem(
'vzors_final_full'
)
||JSON.stringify({
user:null,
clients:[],
events:[]
})
);
function save(){
localStorage.setItem(
'vzors_final_full',
JSON.stringify(DB)
);
}
function auth(){
let syncText=
document.getElementById(
'syncText'
);
let dot=
document.getElementById(
'dot'
);
let uin=
document.getElementById(
'uin'
);
if(
DB.user
&&DB.user.phone
){
syncText.textContent=
"● SYNC "+
DB.user.phone;
dot.style.background=
"#25D366";
uin.textContent=
"✓ "+
DB.user.name+
" | "+
DB.user.phone+
" | Real GCal "+
(DB.user.googleConnected?
"Connected":
"Ready");
}else{
syncText.textContent=
"● SYNC Not connected";
dot.style.background=
"#888";
uin.textContent=
"Not connected";
}
renderToday();
renderClients();
}
let tokenClient=null;
let accessToken=
localStorage.getItem(
'gcal_token'
)||null;
function initGsi(){
if(
!window.google
||!window.google.accounts
){
setTimeout(
initGsi,
1000
);
return;
}
tokenClient=
google.accounts.oauth2.initTokenClient({
client_id:
GOOGLE_CLIENT_ID,
scope:
SCOPES,
callback:(resp)=>{
if(
resp.access_token
){
accessToken=
resp.access_token;
localStorage.setItem(
'gcal_token',
accessToken
);
document.getElementById(
'status'
).textContent=
"✓ Connected!";
document.getElementById(
'status'
).style.color=
"#25D366";
DB.user=
DB.user||
{};
DB.user.googleConnected=
true;
save();
auth();
}
},
});
}
function connectGoogle(){
if(
!tokenClient
){
initGsi();
setTimeout(
()=>{
if(tokenClient){
tokenClient.requestAccessToken({
prompt:'consent'
});
}
},
800
);
return;
}
tokenClient.requestAccessToken({
prompt:'consent'
});
}
async function createEvent(){
let date=
document.getElementById(
'eventDate'
).value;
let time=
document.getElementById(
'eventTime'
).value;
let client=
document.getElementById(
'eventClient'
).value;
if(
!date
||!time
){
alert(
"Выбери дату и время"
);
return;
}
if(
!accessToken
){
alert(
"Сначала подключи Google Calendar"
);
connectGoogle();
return;
}
let startDateTime=
new Date(
date+
"T"+
time+
":00"
);
let endDateTime=
new Date(
startDateTime.getTime()+
60*60*1000
);
let event={
summary:
client?
"Клиент: "+
client:
"Запись Vzors AI",
description:
"Создано через Vzors AI",
start:{
dateTime:
startDateTime.toISOString(),
timeZone:
"Europe/Riga"
},
end:{
dateTime:
endDateTime.toISOString(),
timeZone:
"Europe/Riga"
}
};
try{
let res=
await fetch(
"https://www.googleapis.com/calendar/v3/calendars/primary/events",
{
method:
"POST",
headers:{
"Authorization":
"Bearer "+
accessToken,
"Content-Type":
"application/json"
},
body:
JSON.stringify(event)
}
);
if(
res.ok
){
let data=
await res.json();
document.getElementById(
'status'
).textContent=
"✓ Создано: "+
data.htmlLink;
DB.events.push({
id:data.id,
client:client,
date:date,
time:time
});
save();
auth();
}else{
let err=
await res.text();
document.getElementById(
'status'
).textContent=
"Ошибка: "+
err.substring(0,100);
}
}catch(e){
document.getElementById(
'status'
).textContent=
"Ошибка: "+
e.message;
}
}
function addClient(){
let name=
document.getElementById(
'clientName'
).value;
let phone=
document.getElementById(
'clientPhone'
).value;
let service=
document.getElementById(
'clientService'
).value;
if(
!name
){
return;
}
DB.clients.push({
name:name,
phone:phone,
service:service,
id:Date.now()
});
save();
renderClients();
document.getElementById(
'clientName'
).value=
"";
document.getElementById(
'clientPhone'
).value=
"";
}
function renderClients(){
let list=
document.getElementById(
'clientsList'
);
if(
!list
){
return;
}
list.innerHTML=
"";
DB.clients.forEach(c=>{
let div=
document.createElement(
'div'
);
div.className=
'card';
div.innerHTML=
"<b>"+
c.name+
"</b><br><span style='color:#888;font-size:12px;'>"+
c.phone+
" | "+
c.service+
"</span>";
list.appendChild(div);
});
}
function renderToday(){
let count=
document.getElementById(
'todayCount'
);
let list=
document.getElementById(
'todayList'
);
if(count){
count.textContent=
DB.events.length;
}
if(
!list
){
return;
}
list.innerHTML=
"";
DB.events.slice(-5).forEach(ev=>{
let div=
document.createElement(
'div'
);
div.className=
'card';
div.innerHTML=
"<b>"+
(ev.client||"Запись")+
"</b><br><span style='color:#888;'>"+
ev.date+
" "+
ev.time+
"</span>";
list.appendChild(div);
});
}
function saveSettings(){
let name=
document.getElementById(
'myName'
).value;
let phone=
document.getElementById(
'myPhone'
).value;
DB.user=
DB.user||
{};
DB.user.name=
name||
"Master";
DB.user.phone=
phone||
"+371...";
save();
auth();
alert(
"Сохранено"
);
}
document.querySelectorAll(
'.tab'
).forEach(tab=>{
tab.addEventListener(
'click',
()=>{
document.querySelectorAll(
'.tab'
).forEach(t=>t.classList.remove('active'));
tab.classList.add('active');
document.querySelectorAll(
'.content'
).forEach(c=>c.style.display='none');
let id=
"tab-"+
tab.dataset.tab;
document.getElementById(
id
).style.display=
'block';
}
);
});
document.getElementById(
'authBtn'
).addEventListener(
'click',
connectGoogle
);
window.onload=()=>{
auth();
initGsi();
let today=
new Date().toISOString().split('T')[0];
let d=
document.getElementById(
'eventDate'
);
if(d){
d.value=
today;
}
};
</script>
</body>
</html>
