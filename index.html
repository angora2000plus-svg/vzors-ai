<!DOCTYPE html><html lang="lv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vzors AI</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#F2F0F5] flex justify-center p-3"><div class="w-[390px] bg-white rounded-[32px] p-4"><div class="flex justify-between"><div class="flex gap-2 items-center"><img src="star.png" class="w-8 h-8"><b class="text-[28px]">Vzors AI</b></div><div class="text-center text-[11px]">👓<br>gūdrs koļēģis</div></div><div class="flex justify-center gap-4 mt-6"><button id="prev" class="w-8 h-8 bg-[#F3F1F6] rounded-full">‹</button><h1 id="title" class="text-[26px] font-extrabold">Novembris ir klāt</h1><button id="next" class="w-8 h-8 bg-[#F3F1F6] rounded-full">›</button></div><div class="grid grid-cols-2 gap-3 mt-6"><div class="bg-[#EDE6F5] rounded-[22px] p-3"><b>Manas piezīmes</b><div class="bg-[#F5F1F8] rounded-[14px] mt-3 p-3 flex gap-2"><textarea id="in" placeholder="Runā vai raksti..." class="flex-1 bg-transparent outline-none text-[11px] h-[32px] resize-none"></textarea><button id="mic">🎤</button></div><div id="vs" class="hidden text-[10px] text-purple-600 text-center mt-2">🎙️ Klausos...</div><div class="text-[10px] text-center text-[#9a8ab0] mt-5">STICKERS</div><div id="grid" class="grid grid-cols-4 gap-2 mt-2"><button class="st h-11 rounded-xl bg-[#FFD6E0]"></button><button class="st h-11 rounded-xl bg-[#FFF1A8]"></button><button class="st h-11 rounded-xl bg-[#A8E6FF]"></button><button class="st h-11 rounded-xl bg-[#C8F5C8]"></button><button class="st h-11 rounded-xl bg-[#E6D6FF]"></button><button class="st h-11 rounded-xl bg-[#FFDAB8]"></button><button class="st h-11 rounded-xl bg-[#B8F0E0]"></button><button class="st h-11 rounded-xl bg-[#F5E6D0]"></button></div><div id="notes" class="mt-2 text-[11px] space-y-1 max-h-[90px] overflow-auto"></div><div class="text-[10px] text-center text-[#9a8ab0] mt-5">SAVIENOTIE</div><div class="grid grid-cols-4 gap-2 mt-2 text-[8px] text-center"><button onclick="open('https://inbox.lv')"><div class="w-[50px] h-[50px] bg-white rounded-xl flex items-center justify-center">✉️</div>inbox.lv</button><button onclick="open('https://web.whatsapp.com')"><div class="w-[50px] h-[50px] bg-[#25D366] rounded-xl text-white flex items-center justify-center font-bold">W</div>whatsapp</button><button onclick="open('https://mail.google.com')"><div class="w-[50px] h-[50px] bg-[#FF8A3D] rounded-xl flex items-center justify-center"><img src="claude_orange.png" class="w-6 h-6"></div>gmail</button><button onclick="open('https://google.com')"><div class="w-[50px] h-[50px] bg-white rounded-xl flex items-center justify-center font-bold text-[#4285F4]">G</div>google</button><button onclick="open('https://google.com')"><div class="w-[50px] h-[50px] bg-white rounded-xl flex items-center justify-center font-bold text-[#4285F4]">G</div>gooail</button><button onclick="open('https://facebook.com')"><div class="w-[50px] h-[50px] bg-[#1877F2] rounded-xl text-white flex items-center justify-center font-bold">f</div>facebook</button><button onclick="open('https://maps.google.com')"><div class="w-[50px] h-[50px] bg-white rounded-xl flex items-center justify-center">📍</div>maps</button><button onclick="open('https://maps.google.com')"><div class="w-[50px] h-[50px] bg-white rounded-xl flex items-center justify-center">🗺️</div>maps</button></div></div><div class="bg-white border rounded-[22px] p-3"><div class="flex justify-between items-center"><button id="cPrev" class="w-6 h-6 bg-[#F5F3F7] rounded-full">‹</button><div class="text-[12px] font-bold text-center">Novembris 2026<br>Kalendārs</div><button id="cNext" class="w-6 h-6 bg-[#F5F3F7] rounded-full">›</button></div><div id="days" class="grid grid-cols-7 text-[12px] text-center mt-3 gap-y-1"></div><div class="mt-5"><b class="text-[15px]">Pasākumi</b><div id="ev" class="mt-2 text-[12px]"></div></div><div class="bg-[#F0EDF3] rounded-xl p-3 mt-4"><div class="text-[9px] text-center text-[#9a8ab0]">MODEĻU PARĀDE</div><div class="flex justify-between mt-2"><div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">♾️</div><div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">🌀</div><div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">⬢</div><div class="w-8 h-8 bg-white rounded-full flex items-center justify-center"><img src="star.png" class="w-5 h-5"></div><div class="w-8 h-8 bg-white rounded-full flex items-center justify-center"><img src="claude_orange.png" class="w-5 h-5"></div></div></div></div></div></div><script>let cur=10;const m=["Janvāris","Februāris","Marts","Aprīlis","Maijs","Jūnijs","Jūlijs","Augusts","Septembris","Oktobris","Novembris","Decembris"];function rCal(){const d=document.getElementById('days');d.innerHTML='';const f=new Date(2026,cur,1).getDay();let o=f==0?6:f-1;for(let i=0;i<o;i++)d.innerHTML+="<div></div>";for(let n=1;n<=new Date(2026,cur+1,0).getDate();n++){d.innerHTML+=`<div class="py-1">${n}${[17,20,21,22,24,28].includes(n)?'<div class="w-1 h-1 bg-[#E07A5F] rounded-full mx-auto"></div>':''}</div>`;}}function add(t){const n=document.getElementById('notes');n.innerHTML=`<div class="bg-white rounded px-2 py-1">${t}</div>`+n.innerHTML;}function v(el){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const rec=new SR();rec.lang='lv-LV';document.getElementById('vs').classList.remove('hidden');rec.start();rec.onresult=e=>{const txt=e.results[0][0].transcript;if(el){el.innerHTML=`<span class="text-[8px] px-1">${txt}</span>`;el.classList.remove('h-11');el.classList.add('min-h-[44px]','py-1');}add("🎤 "+txt);document.getElementById('vs').classList.add('hidden');};rec.onend=()=>document.getElementById('vs').classList.add('hidden');}document.getElementById('in').onkeydown=e=>{if(e.key==='Enter'){add(e.target.value);e.target.value='';}};document.getElementById('mic').onclick=()=>v(null);document.querySelectorAll('.st').forEach(b=>b.onclick=()=>v(b));document.getElementById('prev').onclick=()=>{cur--;if(cur<0)cur=11;document.getElementById('title').textContent=m[cur]+" ir klāt";rCal();};document.getElementById('next').onclick=()=>{cur++;if(cur>11)cur=0;document.getElementById('title').textContent=m[cur]+" ir klāt";rCal();};document.getElementById('cPrev').onclick=()=>document.getElementById('prev').click();document.getElementById('cNext').onclick=()=>document.getElementById('next').click();document.getElementById('ev').innerHTML='<div class="flex gap-2"><div class="w-2 h-2 bg-[#E07A5F] rounded-full mt-1"></div><div>Tēva diena — 15. nov<br><span class="text-[#777] text-[11px]">Svēkti</span></div></div><div class="flex gap-2 mt-2"><div class="w-2 h-2 bg-[#E07A5F] rounded-full mt-1"></div><div>Lāčplēša diena — 18. nov<br><span class="text-[#777] text-[11px]">Atceres diena</span></div></div>';rCal();</script></body></html>
