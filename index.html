<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vzors AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2F0F5] flex justify-center p-3">
<div class="w-[390px] bg-white rounded-[32px] p-4 shadow-sm">

  <!-- HEADER -->
  <div class="flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-[#8A6CFF] rounded-full flex items-center justify-center text-white text-[18px]">✦</div>
      <div class="text-[28px] font-extrabold">Vzors AI</div>
    </div>
    <div class="text-[11px] text-center leading-none text-[#6b6b7a]">👓<br>gūdrs<br>koļēģis</div>
  </div>

  <!-- MONTH TITLE -->
  <div class="flex items-center justify-center gap-6 mt-6">
    <button id="prev" class="w-8 h-8 rounded-full bg-[#F3F1F6]">‹</button>
    <div class="text-center">
      <h1 id="ttl" class="text-[26px] font-extrabold">Novembris ir klāt</h1>
      <div id="weather" class="text-[13px] text-[#8a8a9a] mt-1">⛅ laika ziņas: 1.8°C Rīga</div>
    </div>
    <button id="next" class="w-8 h-8 rounded-full bg-[#F3F1F6]">›</button>
  </div>

  <div class="grid grid-cols-2 gap-3 mt-6">

    <!-- LEFT -->
    <div class="bg-[#EDE6F5] rounded-[22px] p-3">
      <b class="text-[#3d2c5a]">Manas piezīmes</b>
      <div class="bg-white rounded-[14px] mt-3 p-3 flex gap-2 shadow-sm">
        <textarea id="input" placeholder="Runā vai raksti — pievieno piezīmi..." class="flex-1 bg-transparent outline-none text-[11px] h-8 resize-none placeholder:text-[#9a8ab0]"></textarea>
        <button id="mic">🎤</button>
      </div>
      <div id="voiceStatus" class="hidden text-[10px] text-[#8A6CFF] text-center mt-2">🎙️ Klausos...</div>

      <div class="text-[10px] tracking-widest text-center text-[#9a8ab0] mt-5">STICKERS</div>
      <div id="grid" class="grid grid-cols-4 gap-2 mt-2"></div>

      <div class="text-[10px] tracking-widest text-center text-[#9a8ab0] mt-6">SAVIENOTIE</div>
      <div class="grid grid-cols-4 gap-2 mt-2 text-[8px] text-center leading-none">
        <button onclick="window.open('https://inbox.lv')"><div class="w-[52px] h-[52px] bg-white rounded-[14px] flex items-center justify-center text-[20px] shadow-sm">✉️</div><div class="mt-1">inbox.lv</div></button>
        <button onclick="window.open('https://web.whatsapp.com')"><div class="w-[52px] h-[52px] bg-[#25D366] rounded-[14px] flex items-center justify-center text-white font-bold shadow-sm">W</div><div class="mt-1">whatsapp</div></button>
        <button onclick="window.open('https://mail.google.com')"><div class="w-[52px] h-[52px] bg-[#FF8A3D] rounded-[14px] flex items-center justify-center shadow-sm">🌸</div><div class="mt-1">gmail</div></button>
        <button onclick="window.open('https://google.com')"><div class="w-[52px] h-[52px] bg-white rounded-[14px] flex items-center justify-center font-bold text-[#4285F4] text-[18px] shadow-sm">G</div><div class="mt-1">google</div></button>
        <button onclick="window.open('https://google.com')"><div class="w-[52px] h-[52px] bg-white rounded-[14px] flex items-center justify-center font-bold text-[#4285F4] text-[18px] shadow-sm">G</div><div class="mt-1">gooail</div></button>
        <button onclick="window.open('https://facebook.com')"><div class="w-[52px] h-[52px] bg-[#1877F2] rounded-[14px] flex items-center justify-center text-white font-bold text-[18px] shadow-sm">f</div><div class="mt-1">facebook</div></button>
        <button onclick="window.open('https://maps.google.com')"><div class="w-[52px] h-[52px] bg-white rounded-[14px] flex items-center justify-center shadow-sm">📍</div><div class="mt-1">maps</div></button>
        <button onclick="window.open('https://maps.google.com')"><div class="w-[52px] h-[52px] bg-white rounded-[14px] flex items-center justify-center shadow-sm">🗺️</div><div class="mt-1">maps</div></button>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="bg-white border border-[#F0EDF3] rounded-[22px] p-3">
      <div class="flex justify-between items-center">
        <button id="cPrev" class="w-6 h-6 rounded-full bg-[#F5F3F7]">‹</button>
        <div class="text-[12px] font-bold text-center leading-tight">Novembris 2026<br>Kalendārs</div>
        <button id="cNext" class="w-6 h-6 rounded-full bg-[#F5F3F7]">›</button>
      </div>
      <div class="grid grid-cols-7 text-[9px] text-[#9a8ab0] text-center mt-4"><div>P</div><div>O</div><div>T</div><div>C</div><div>P</div><div>S</div><div>Sv</div></div>
      <div id="days" class="grid grid-cols-7 text-[12px] text-center mt-2 gap-y-1"></div>
      <div class="mt-5"><b class="text-[15px]">Pasākumi</b><div id="events" class="mt-3 text-[12px]"></div></div>
      <div class="bg-[#F0EDF3] rounded-xl p-3 mt-5">
        <div class="text-[9px] tracking-widest text-center text-[#9a8ab0]">MODEĻU PARĀDE</div>
        <div class="flex justify-between mt-2">
          <button class="w-8 h-8 bg-white rounded-full shadow-sm">♾️</button>
          <button class="w-8 h-8 bg-white rounded-full shadow-sm">🌀</button>
          <button class="w-8 h-8 bg-white rounded-full shadow-sm">⬢</button>
          <button class="w-8 h-8 bg-white rounded-full shadow-sm">✦</button>
          <button class="w-8 h-8 bg-[#FF8A3D] rounded-full shadow-sm">✿</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let cur = 10;
const months = ["Janvāris","Februāris","Marts","Aprīlis","Maijs","Jūnijs","Jūlijs","Augusts","Septembris","Oktobris","Novembris","Decembris"];
const icons = ["✨","♡","⚡","🍃","☕","🐱","✓","☾"];
const bgs = ["bg-[#FFD6E0]/70","bg-[#FFF1A8]/70","bg-[#A8E6FF]/70","bg-[#C8F5C8]/70","bg-[#E6D6FF]/70","bg-[#FFDAB8]/70","bg-[#B8F0E0]/70","bg-[#F5E6D0]/70"];

function renderCal(){
  days.innerHTML="";
  let first = new Date(2026,cur,1).getDay();
  let off = first==0?6:first-1;
  for(let i=0;i<off;i++) days.innerHTML+="<div></div>";
  for(let d=1; d<=new Date(2026,cur+1,0).getDate(); d++){
    let dot = [17,20,21,22,24,28].includes(d) ? '<div class="w-1 h-1 bg-[#E07A5F] rounded-full mx-auto"></div>' : '';
    days.innerHTML+=`<div class="py-1">${d}${dot}</div>`;
  }
}
function addSticker(text,i){
  let el=document.createElement("div");
  el.className=bgs[i%8]+" rounded-[12px] p-2 min-h-[52px] relative overflow-hidden border border-white/60";
  el.innerHTML=`<div class="absolute inset-0 flex items-center justify-center text-[22px] opacity-[0.12] pointer-events-none">${icons[i%8]}</div><div class="relative z-10 text-[10px] leading-[1.2] break-words">${text}</div><button onclick="this.parentNode.remove()" class="relative z-10 text-[7px] text-[#9a8ab0] mt-1 ml-auto block">[delete]</button>`;
  grid.prepend(el);
}
function voice(){
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  let rec=new SR(); rec.lang='lv-LV';
  voiceStatus.classList.remove("hidden"); rec.start();
  rec.onresult=e=>{addSticker(e.results[0][0].transcript,grid.children.length); voiceStatus.classList.add("hidden");};
  rec.onend=()=>voiceStatus.classList.add("hidden");
}
input.onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault(); if(e.target.value.trim()){addSticker(e.target.value,grid.children.length); e.target.value="";}}
};
mic.onclick=voice;
prev.onclick=()=>{cur--; if(cur<0)cur=11; ttl.textContent=months[cur]+" ir klāt"; renderCal();};
next.onclick=()=>{cur++; if(cur>11)cur=0; ttl.textContent=months[cur]+" ir klāt"; renderCal();};
cPrev.onclick=()=>prev.click(); cNext.onclick=()=>next.click();
events.innerHTML='<div class="flex gap-2"><div class="w-2 h-2 bg-[#E07A5F] rounded-full mt-1.5"></div><div>Tēva diena — 15. nov<br><span class="text-[#8a8a9a] text-[11px]">Svēkti</span></div></div><div class="flex gap-2 mt-3"><div class="w-2 h-2 bg-[#E07A5F] rounded-full mt-1.5"></div><div>Lāčplēša diena — 18. nov<br><span class="text-[#8a8a9a] text-[11px]">Atceres diena</span></div></div>';
renderCal();
fetch('https://api.open-meteo.com/v1/forecast?latitude=56.95&longitude=24.11&current_weather=true').then(r=>r.json()).then(d=>{if(d.current_weather) weather.textContent=`⛅ laika ziņas: ${d.current_weather.temperature}°C Rīga`;});
</script>
</body>
</html>
