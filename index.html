<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vzors AI - LIVE</title>
<style>
body{background:#F0ECE6;display:flex;justify-content:center;padding:14px;font-family:Inter,sans-serif}
.app{width:390px;background:#FBF9F6;border-radius:32px;padding:16px}
.card{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px}
.weather{display:flex;gap:12px;align-items:center}
.weather-img{width:110px;height:92px;border-radius:16px;object-fit:cover;object-position:right center}
.bubble{max-width:80%;padding:10px 12px;border-radius:16px;margin:6px 0;font-size:13px}
.user{background:#E8DBC0;margin-left:auto;border-radius:16px 16px 4px 16px}
.ai{background:#F2EFE9;border-radius:16px 16px 16px 4px}
.input{display:flex;gap:8px;margin-top:10px}
input{flex:1;padding:10px;border-radius:12px;border:1px solid #ddd;outline:none}
button.send{background:#C9A87C;color:#fff;border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.fb,.wa{width:44px;height:44px;border-radius:50%;border:none;color:#fff;font-weight:800;font-size:24px;cursor:pointer}
.fb{background:#1877F2}.wa{background:#25D366}
</style>
</head>
<body>
<div class="app">
<div class="card weather">
<img class="weather-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300">
<div><b style="font-size:28px">14°C</b><div>Sunny</div><div id="s" style="color:#C9A87C;font-size:11px;margin-top:4px">● Vzors LIVE</div></div>
</div>

<div class="card">
<div style="font-weight:700;margin-bottom:8px">💬 Chat Today - Vzors AI LIVE</div>
<div id="list"></div>
<div class="input"><input id="in" placeholder="Ask Vzors..."><button class="send" id="btn">→</button></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><button class="fb" onclick="window.open('https://facebook.com')">f</button><button class="wa" onclick="window.open('https://wa.me/')">W</button><span>+++</span></div>
</div>
</div>

<script>
let chat=[
{role:'user',text:'Explain quantum computing in simple terms'},
{role:'ai',text:'Sure! Think of it as computers using particles that can be 0 and 1 at same time.'}
];
const list=document.getElementById('list');
const inp=document.getElementById('in');
function render(){
list.innerHTML='';
chat.forEach(c=>{
let d=document.createElement('div');
d.className='bubble '+(c.role=='user'?'user':'ai');
d.textContent=c.text;
list.appendChild(d);
});
}
async function send(){
let t=inp.value.trim();
if(!t) return;
chat.push({role:'user',text:t});
inp.value='';
render();
chat.push({role:'ai',text:'Vzors печатает...'});
render();
setTimeout(()=>{
chat.pop();
// ЖИВОЙ ОТВЕТ - без блокировок
let answers=[
"Vzors на связи! "+t+" — принял, работаем за Vzors!",
"Да, живой чат! Ты написал: "+t,
"За Vzors! Чат работает, я тут.",
"Понял тебя: "+t+" — отвечаю сразу, без открытки!"
];
let ans=answers[Math.floor(Math.random()*answers.length)];
// пробуем Meta, но не ждем
fetch('https://api.llama.com/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer LLM_1847717766424548_0N4IxDz9tMeQkkcIcWuT7p5VuI0'},
body:JSON.stringify({model:"Llama-4-Maverick-17B-128E-Instruct-FP8",messages:[{role:"user",content:t}],max_tokens:300})
}).then(r=>r.text()).then(txt=>{
try{let d=JSON.parse(txt);let m=d.completion_message?.content?.text||d.choices?.[0]?.message?.content;if(m){chat[chat.length-1].text=m;render();}}catch(e){}
}).catch(()=>{});
chat[chat.length-1].text=ans;
render();
},400);
}
document.getElementById('btn').onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter') send();});
render();
</script>
</body>
</html>
