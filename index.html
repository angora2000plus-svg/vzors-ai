<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VZOR AI - Delta Core</title>
<style>
body{margin:0;background:#fff;color:#000;font-family:Inter,monospace;padding:24px}
header{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:12px}
.dot{width:8px;height:8px;background:#0066ff;border-radius:50%;box-shadow:0 0 8px #0066ff;animation:blink 1s infinite;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.m{width:28px;height:28px;border:1.5px solid #0066ff;color:#0066ff;display:flex;align-items:center;justify-content:center;font-weight:900;opacity:0.2}
.m.active{opacity:1;background:#0066ff;color:#fff;box-shadow:0 0 15px #0066ff}
.hero{display:flex;justify-content:center;margin:20px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px;margin:0 auto}
.card{border:1px solid #e5e5e5;border-radius:16px;padding:16px}
.card.prem{border:2px solid #000}
a.btn{display:inline-block;background:#000;color:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:11px;letter-spacing:0.1em;margin-top:10px}
a.btn.white{background:#fff;color:#000;border:1px solid #000}
input{width:100%;border:1px solid #ddd;padding:10px;border-radius:10px;font-family:monospace;margin-top:8px}
</style>
</head>
<body>
<header>
<div style="font-size:11px;letter-spacing:0.2em;display:flex;gap:8px;align-items:center"><span class="dot"></span> VZOR AI // DELTA CORE // COMPATIBLE WITH SMARTGLASSES</div>
<div class="m" id="mBox">M</div>
</header>

<div class="hero"><canvas id="c" width="400" height="200"></canvas></div>

<div class="grid">
<div class="card">
<b>VZOR AI CORE</b><br><small style="color:#888">vzor-core/skills/delta.py — anti-recursive</small>
<p style="font-size:12px">Самоопирающееся облако. Спиральная архитектура. Вызов памяти по кодовому слову.</p>
<a class="btn" href="https://angora2000plus-svg.github.io/VZOR-SmartGlasses-26PREMIUM/">→ VZOR SmartGlasses PREMIUM</a>
<a class="btn white" href="https://angora2000plus-svg.github.io/VZOR-SmartGlasses-26PREMIUM/tech-passport.html">ТЕХПАСПОРТ</a>
</div>
<div class="card prem">
<b>MEMORY CLOUD RECALL</b>
<input id="recallInput" placeholder="кодовое слово: рига2026">
<button onclick="recallMemory()" style="margin-top:8px;background:#0066ff;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer">Вызвать М из облака очков</button>
<div id="log" style="font-size:11px;margin-top:10px;color:#444"></div>
</div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),mBox=document.getElementById('mBox'),log=document.getElementById('log');let t=0;
let memories=JSON.parse(localStorage.getItem('vzor_cloud')||localStorage.getItem('vzor_cloud_shared')||'{}');
function draw(){ctx.clearRect(0,0,400,200);ctx.save();ctx.translate(200,100);t+=0.02;let up=Math.sin(t)>0.3;ctx.strokeStyle=up?'#0066ff':'#ddd';ctx.lineWidth=up?2:1;if(up)ctx.shadowBlur=10,ctx.shadowColor='#0066ff';ctx.beginPath();for(let i=0;i<120;i++){let a=i*0.2+t*1.8,r=i*0.6,yOff=up?-Math.sin(t*3+i*0.07)*12:0,x=Math.cos(a)*r,y=Math.sin(a)*r+yOff;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.restore();if(up&&Math.random()<0.02){mBox.classList.add('active');setTimeout(()=>mBox.classList.remove('active'),400);}requestAnimationFrame(draw);}draw();
function recallMemory(){let code=document.getElementById('recallInput').value.trim().toLowerCase();memories=JSON.parse(localStorage.getItem('vzor_cloud')||localStorage.getItem('vzor_cloud_shared')||'{}');if(memories[code]){log.innerHTML=`<div style="border-left:3px solid #0066ff;padding-left:8px;background:#f0f7ff"><b>MEMORIZED ${code} [M]</b><br>${memories[code].text}<br><small>${memories[code].time}</small></div>`;mBox.classList.add('active');setTimeout(()=>mBox.classList.remove('active'),700);}else log.innerHTML=`<div style="color:#c00">${code} — не найдено. Сначала создай его в SmartGlasses</div>`;}
</script>
</body>
</html>
