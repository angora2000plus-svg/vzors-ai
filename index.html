<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vzors AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif}
body{background:#EADFD9;max-width:430px;margin:0 auto;padding:10px}
.card{background:#FFF6F1;border-radius:22px;padding:14px;border:1px solid #EADFD9;margin-bottom:12px}
.hdr{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;border:2px solid #C7A26B;color:#C7A26B;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.ht b{font-size:21px;font-weight:800;display:block;line-height:1.1}
.ht span{font-size:11px;color:#8B7D74}
.top{margin-left:auto;display:flex;gap:6px}
.top button{font-size:10px;padding:6px 12px;border-radius:20px;border:1.2px solid #C7A26B;background:#FFF6F1;cursor:pointer}
.wave{width:100%;height:32px;display:flex;gap:3px;justify-content:center;align-items:center;margin:10px 0}
.wave i{width:3px;background:#D6A97A;border-radius:3px;display:block}
.notes-bar{display:flex;align-items:center;gap:10px;padding:12px;background:#FFF6F1;border-radius:16px;border:1px solid #F2E6DE;margin-bottom:10px}
.dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #D9C7B8;flex-shrink:0}
.dot.active{box-shadow:0 0 0 2.5px #C7A26B;transform:scale(1.15)}
.notes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.note{border-radius:12px;padding:10px;font-size:11px;min-height:64px;cursor:pointer;border:1.5px dashed #D9C7B8;display:flex;align-items:center;justify-content:center;color:#9A8A82;text-align:center;word-break:break-word}
.note.filled{border-style:solid;color:#3A2E28;justify-content:flex-start;text-align:left;font-weight:500;background:#FFEDE6}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:#8B7D74;margin:8px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.days div{height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;cursor:pointer}
.days .hol{color:#C07A5A}.days .beige{background:#EADFC6}.days .red{border:2px solid #B94A3A;color:#B94A3A;font-weight:700}
.chat-input{display:flex;gap:6px;margin-top:10px}
.chat-input input{flex:1;padding:12px 16px;border-radius:24px;border:1.5px solid #D9C7B8;font-size:13px;outline:none}
.chat-input button{padding:12px 16px;border-radius:24px;border:none;background:#C7A26B;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.answer-box{background:#fff;border-radius:14px;padding:14px;margin-top:12px;border:1px solid #EADFD9;min-height:50px;font-size:13px;line-height:1.5;display:none}
.answer-box.show{display:block}
#colorPopup{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;padding:14px 18px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.18);display:none;gap:10px;z-index:999}
#colorPopup.show{display:flex;flex-wrap:wrap;justify-content:center;max-width:280px}
</style>
</head>
<body>

<div class="card hdr">
  <div class="logo">V</div>
  <div class="ht"><b>Vzors AI</b><span>powered by <b>Spark</b> gudrs kolēģis</span></div>
  <div class="top"><button>Reģistrēties</button><button>Pieslēgties</button></div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:700">Vzors runā — mana balss viņam:</div>
  <div style="font-size:12px;color:#8B7D74;margin-top:4px">What can I do for you?</div>
  <div class="wave" id="wave"></div>
  <div class="chat-input">
    <input id="vzQ" placeholder="Jautā man kaut ko..." autocomplete="off">
    <button onclick="askVzors()">Ask</button>
    <button onclick="startVoice()" style="background:#EADFD9;color:#5A4A3A;font-size:16px">🎙️</button>
  </div>
  <div id="vzAnswer" class="answer-box"></div>
</div>

<div style="font-size:14px;font-weight:800;margin:8px 4px">Manas piezīmes:</div>
<div class="notes-bar">
  <div style="font-size:20px;cursor:pointer" onclick="dictateNote()">🎙️</div>
  <div style="font-size:12px;font-weight:700">Izvēlies krāsu:</div>
  <div style="display:flex;gap:10px" id="dots"></div>
  <div style="margin-left:auto;font-size:20px;color:#C7A26B;cursor:pointer;font-weight:800;padding:4px" onclick="toggleMore()">•••</div>
</div>
<div class="notes" id="notes"></div>
<div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center">
  <button onclick="addEmpty()" style="padding:8px 16px;border-radius:20px;border:1.5px solid #C7A26B;background:#fff;font-size:12px;font-weight:600;cursor:pointer">+ Tukša lapiņa</button>
  <button onclick="clearAll()" style="padding:8px 12px;border:none;background:transparent;font-size:11px;color:#8B7D74;cursor:pointer">Notīrīt</button>
</div>

<div class="card" style="margin-top:14px">
  <div style="font-weight:700;font-size:14px;margin-bottom:8px">📅 To do! Calendar November 2026</div>
  <div class="week"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
  <div class="days" id="days"></div>
  <div id="calInfo" style="font-size:11px;margin-top:10px;color:#5A4A3A;min-height:14px"></div>
</div>

<div id="colorPopup"></div>

<script>
/* ЦВЕТА - РАБОТАЕТ */
const COLORS=['#FFB3A0','#FFD6C2','#A2D5E8','#FFF1B0','#C2E8B0','#FFD6E6','#FFEDE6','#EADFC6'];
let sel = localStorage.getItem('vz_sel') || COLORS[6];
let showAllDots = false;

function renderDots(){
  const list = showAllDots ? COLORS : COLORS.slice(0,4);
  document.getElementById('dots').innerHTML = list.map(c => 
    `<div class="dot ${c===sel?'active':''}" style="background:${c}" onclick="pick('${c}')"></div>`
  ).join('');
}
function pick(c){
  sel=c;
  localStorage.setItem('vz_sel',c);
  renderDots();
  document.getElementById('colorPopup').classList.remove('show');
  if(navigator.vibrate) navigator.vibrate(20);
}
function toggleMore(){
  showAllDots = !showAllDots;
  if(showAllDots){
    const pop=document.getElementById('colorPopup');
    pop.innerHTML=COLORS.map(c=>`<div class="dot ${c===sel?'active':''}" style="background:${c};width:34px;height:34px" onclick="pick('${c}')"></div>`).join('');
    pop.classList.add('show');
    setTimeout(()=>pop.classList.remove('show'),4000);
  }
  renderDots();
}
renderDots();

/* ЗАМЕТКИ - ЧИСТЫЕ */
let notes = JSON.parse(localStorage.getItem('vz_notes_final')||'[]');
if(!notes.length){ notes = Array(10).fill(0).map(()=>({c:'',bg:sel})) }

function renderNotes(){
  document.getElementById('notes').innerHTML = notes.map((n,i)=>{
    if(!n.c) return `<div class="note" style="background:${n.bg}" onclick="edit(${i})">+ Tukša</div>`;
    return `<div class="note filled" style="background:${n.bg}" onclick="edit(${i})">${escapeHtml(n.c)}</div>`;
  }).join('');
  localStorage.setItem('vz_notes_final',JSON.stringify(notes));
}
function escapeHtml(s){return s.replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function edit(i){
  const cur=notes[i].c;
  const t=prompt('Tava piezīme:',cur);
  if(t===null) return;
  notes[i].c=t.trim();
  notes[i].bg=sel; // МЕНЯЕТ ЦВЕТ НА ВЫБРАННЫЙ
  renderNotes();
}
function addEmpty(){ notes.unshift({c:'',bg:sel}); renderNotes(); }
function clearAll(){ if(confirm('Notīrīt visas piezīmes?')){ notes=Array(10).fill(0).map(()=>({c:'',bg:sel})); renderNotes(); } }
function dictateNote(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ const t=prompt('Dikti piezīmi:'); if(t){notes.unshift({c:t,bg:sel});renderNotes()} return; }
  const rec=new SR(); rec.lang='lv-LV'; rec.start();
  rec.onresult=e=>{ notes.unshift({c:e.results[0][0].transcript,bg:sel}); renderNotes(); }
}
renderNotes();

/* КАЛЕНДАРЬ */
function renderDays(){
  let h=''; for(let i=0;i<6;i++) h+=`<div></div>`;
  for(let d=1;d<=30;d++){
    let cls=''; if([1,8,15,22,29].includes(d)) cls='hol';
    if([1,2,11].includes(d)) cls+=' beige'; if(d==18) cls=' red beige';
    h+=`<div class="${cls}" onclick="selectDay(${d})">${d}</div>`;
  }
  document.getElementById('days').innerHTML=h;
}
renderDays();
function selectDay(d){
  document.getElementById('calInfo').innerText = d==18?'🇱🇻 18 Nov - Latvijas Republikas proklamēšanas diena! - brīvdiena':d+' Nov selected';
}

/* VZORS - ТИХО, ТОЛЬКО ПО КОМАНДЕ */
function idleWave(){ const w=document.getElementById('wave'); let html=''; for(let i=0;i<48;i++) html+=`<i style="height:3px;opacity:0.35"></i>`; w.innerHTML=html; }
function activeWave(){ const w=document.getElementById('wave'); let html=''; for(let i=0;i<48;i++){ let ht=4+Math.random()*22; html+=`<i style="height:${ht}px"></i>` } w.innerHTML=html; }
idleWave(); let wInt=null;
function startW(){ if(wInt) clearInterval(wInt); wInt=setInterval(activeWave,180); }
function stopW(){ if(wInt) clearInterval(wInt); setTimeout(idleWave,800); }

function askVzors(){
  const q=document.getElementById('vzQ').value.trim();
  if(!q) return; showAnswer(q);
}
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ const q=prompt('Jautā Vzoram:'); if(q) showAnswer(q); return; }
  const rec=new SR(); rec.lang='lv-LV'; rec.start();
  const box=document.getElementById('vzAnswer'); box.className='answer-box show'; box.innerHTML='🎧 Klausos... runā!';
  startW();
  rec.onresult=e=>{ const t=e.results[0][0].transcript; document.getElementById('vzQ').value=t; showAnswer(t); }
  rec.onend=()=>{ setTimeout(stopW,1000); }
}
function showAnswer(q){
  const box=document.getElementById('vzAnswer');
  box.className='answer-box show';
  box.innerHTML=`<b>Tu:</b> ${escapeHtml(q)}<br><br><b>Vzors:</b> <span id="typing">Domāju...</span>`;
  startW();
  setTimeout(()=>{
    document.getElementById('typing').innerText=`Sapratu: "${q}". Pierakstīju! ✅`;
    setTimeout(stopW,1000);
    if(q.toLowerCase().includes('piezīme')||q.toLowerCase().includes('pieraksti')){
      notes.unshift({c:q,bg:sel}); renderNotes();
    }
  },700);
  document.getElementById('vzQ').value='';
}
document.getElementById('vzQ').addEventListener('keydown',e=>{ if(e.key==='Enter') askVzors(); });
</script>
</body>
</html>
