<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vzors AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f5f4f8;font-family:Inter,sans-serif}</style>
</head>
<body class="flex justify-center p-3">
<div class="w-[420px] bg-white rounded-[32px] shadow-xl p-4">
<div class="flex justify-between"><div class="flex gap-2 items-center text-[30px] font-extrabold">✦ Vzors AI</div><div class="text-right"><div>👓</div><div class="text-[11px] text-gray-500">gūdris koļēģis</div></div></div>
<div class="flex justify-center items-center gap-3 mt-6"><button class="w-8 h-8 bg-gray-100 rounded-full">‹</button><div class="text-[30px] font-extrabold">Novembris ir klāt</div><button class="w-8 h-8 bg-gray-100 rounded-full">›</button></div>
<div class="text-center text-sm text-gray-500 mt-1">⛅ laika ziņas</div>
<div class="grid grid-cols-2 gap-3 mt-5">
<div class="bg-[#EDE3F3] rounded-[28px] p-4">
<div class="font-bold text-[#3B2A5A]">Manas piezīmes</div>
<div class="bg-white rounded-xl mt-2 p-2.5 flex gap-2"><input id="noteInput" placeholder="Runā vai raksti — pievieno piezīmi..." class="flex-1 text-[11px] outline-none"><button>🎤</button></div>
<div id="notesList" class="mt-2 text-[11px]"></div>
<div class="text-[11px] tracking-widest text-center text-[#7A6A9A] mt-8">STICKERS</div>
<div class="grid grid-cols-4 gap-2 mt-3">
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.3"><path d="M12 3l2.5 5 5 2-5 2-2.5 5-2.5-5-5-2 5-2z"/></svg></button>
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.3"><path d="M12 19l-6.5-6.5a3.5 3.5 0 015-5L12 9l1.5-1.5a3.5 3.5 0 015 5z"/></svg></button>
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.3"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg></button>
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.3"><path d="M11 20A10 10 0 0020 10c0-3-4-8-9-8S2 7 2 12c0 3 3 6 9 8z"/></svg></button>
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.3"><path d="M6 8h12v4a6 6 0 01-12 0z"/><path d="M18 8c1 0 2 .5 2 2s-1 2-2 2"/></svg></button>
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="30" height="26" viewBox="0 0 28 24" fill="none" stroke="#000" stroke-width="1.2"><path d="M8 9c0-2 2-4 6-4s6 2 6 4v2H8z"/><circle cx="10" cy="12" r="1" fill="#000"/><circle cx="18" cy="12" r="1" fill="#000"/></svg></button>
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.3"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg></button>
<button class="bg-[#F8E9EC] rounded-xl h-[52px] flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.3"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
</div>
<div class="text-[11px] tracking-widest text-center text-[#7A6A9A] mt-8">SAVIENOTIE</div>
<div class="grid grid-cols-4 gap-2 mt-3 text-[10px] text-center">
<a href="https://inbox.lv"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_inbox.png" class="w-9 h-9"></div>inbox.lv</a>
<a href="https://whatsapp.com"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_whatsapp.png" class="w-9 h-9"></div>whatsapp</a>
<a href="https://gmail.com"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_gmail.png" class="w-9 h-9"></div>gmail</a>
<a href="https://google.com"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_google.png" class="w-9 h-9"></div>google</a>
<a href="https://google.com"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_gooail.png" class="w-9 h-9"></div>gooail</a>
<a href="https://facebook.com"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_facebook.png" class="w-9 h-9"></div>facebook</a>
<a href="https://maps.google.com"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_maps1.png" class="w-9 h-9"></div>maps</a>
<a href="https://maps.google.com"><div class="bg-white rounded-xl h-[52px] flex items-center justify-center"><img src="icon_maps2.png" class="w-9 h-9"></div>maps</a>
</div>
</div>
<div class="bg-white border rounded-[28px] p-3">
<div class="flex justify-between items-center"><button class="w-7 h-7 bg-gray-100 rounded-full">‹</button><div class="font-bold text-center text-[13px]">Novembris 2026<br>Kalendars</div><button class="w-7 h-7 bg-gray-100 rounded-full">›</button></div>
<div class="grid grid-cols-7 text-[11px] text-center mt-4 text-gray-500"><span>P</span><span>O</span><span>T</span><span>C</span><span>P</span><span>S</span><span>Sv.</span></div>
<div id="calendar" class="grid grid-cols-7 text-[12px] text-center mt-2"></div>
<div class="mt-6 font-bold">Pasākumi</div>
<div class="mt-3 text-[12px]"><div>🔴 Tēva diena — 15. nov<br><span class="text-gray-500">Svētki</span></div><div class="mt-3">🔴 Lāčplēša diena — 18. nov<br><span class="text-gray-500">Atceres diena</span></div></div>
<div class="bg-[#F0EEF2] rounded-xl p-3 mt-6 text-center"><div class="text-[10px] tracking-widest text-gray-500">MODEĻU PARADE</div><div class="flex justify-between mt-2 text-lg"><span>∞</span><span>🌀</span><span class="bg-black text-white text-[8px] px-1 rounded">GPT</span><span>✦</span><span>✿</span></div></div>
</div>
</div>
</div>
<script>
const cal=document.getElementById('calendar');const dots=[11,13,14,17,19,20,21,22,24,28];for(let i=0;i<5;i++)cal.innerHTML+='<span></span>';for(let d=1;d<=30;d++){cal.innerHTML+=`<button class='py-1'>${d}${dots.includes(d)?'<div style="width:4px;height:4px;background:#e07a7a;border-radius:50%;margin:2px auto"></div>':''}</button>`}
const inp=document.getElementById('noteInput');const list=document.getElementById('notesList');let notes=JSON.parse(localStorage.getItem('vzors')||'[]');function render(){list.innerHTML=notes.map((n,i)=>`<div class='bg-white/70 rounded p-1 flex justify-between'><span>${n}</span><button onclick='del(${i})'>✕</button></div>`).join('')}window.del=i=>{notes.splice(i,1);localStorage.setItem('vzors',JSON.stringify(notes));render()};inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value){notes.unshift(inp.value);localStorage.setItem('vzors',JSON.stringify(notes));inp.value='';render()}};render();
</script>
</body>
</html>
