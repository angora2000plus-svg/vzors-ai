<script>
const cal=document.getElementById('calendar');const dots=[11,13,14,17,19,20,21,22,24,28];for(let i=0;i<5;i++)cal.innerHTML+='<span></span>';for(let d=1;d<=30;d++){cal.innerHTML+=`<button class='py-1'>${d}${dots.includes(d)?'<div style="width:4px;height:4px;background:#e07a7a;border-radius:50%;margin:2px auto"></div>':''}</button>`}
let notes=JSON.parse(localStorage.getItem('vzors')||'[]');const inp=document.getElementById('note');const list=document.getElementById('list');function render(){list.innerHTML=notes.map((n,i)=>`<div class='bg-white/70 rounded p-1 flex justify-between'><span>${n}</span><button onclick='del(${i})'>✕</button></div>`).join('')}window.del=i=>{notes.splice(i,1);localStorage.setItem('vzors',JSON.stringify(notes));render()};inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value){notes.unshift(inp.value);localStorage.setItem('vzors',JSON.stringify(notes));inp.value='';render()}};render();
