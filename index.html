<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vzors AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#F0ECE6;display:flex;justify-content:center;padding:14px;font-family:Inter,sans-serif}
.app{width:390px;background:#FBF9F6;border-radius:32px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 6px 18px}
.logo{display:flex;align-items:center;gap:10px}.logo-mark{width:52px;height:64px}.logo-text{font-size:34px;font-weight:700;color:#2E2E2E}
.header-icons{display:flex;gap:14px}.icon-btn{background:none;border:none;cursor:pointer;padding:6px}
.icon-btn svg{width:26px;height:26px;stroke:#3A3A3A;fill:none;stroke-width:1.8}
.card{background:#FFF;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}
.weather{display:flex;gap:14px;align-items:center}.weather-img{width:110px;height:92px;border-radius:16px;object-fit:cover;object-position:right center}
.bubble{max-width:82%;padding:10px 12px;border-radius:16px;font-size:13px;margin:8px 0;white-space:pre-wrap;word-break:break-word}.bubble.user{background:#F2EFE9;border-radius:16px 16px 4px 16px;margin-left:auto}.bubble.ai{background:#F2EFE9;border-radius:16px 16px 16px 4px}
.chat-input{display:flex;gap:8px;margin-top:12px}.chat-input input{flex:1;border:1px solid #E8E0D5;border-radius:12px;padding:10px 12px;font-size:13px;outline:none}.chat-input button{background:#C9A87C;color:#fff;border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.cal-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px;padding:0 8px 12px}.grid{display:grid;grid-template-columns:50px repeat(7,1fr);gap:6px;text-align:center}.dow{font-size:11px;color:#9A9A9A}.wlabel{font-size:10px;color:#9A9A9A;display:flex;align-items:center}.day{background:#F7F2E8;border-radius:10px;padding:7px 0;font-size:13px;cursor:pointer}.day.hl{background:#E8DBC0}
.notes-row{display:flex;gap:10px;flex-wrap:wrap}.sticker{border-radius:14px;padding:12px;text-align:center;font-weight:600;font-size:14px;min-width:110px;flex:1;cursor:pointer}.sticker.pink{background:#FBE7EB;color:#C17B87}.sticker.yellow{background:#FFF2A8;color:#B89C2E}.mic{width:54px;height:54px;border-radius:50%;background:#C9A87C;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;border:none}
.bottom{background:#FFF;border-radius:22px;padding:10px 14px;display:flex;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.06)}}.social{display:flex;gap:10px}.fb,.wa{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;border:none;cursor:pointer}.fb{background:#1877F2}.wa{background:#25D366}.plus{width:44px;height:44px;border:1.8px dashed #C8C8C8;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#B5B5B5;font-size:20px;background:none;cursor:pointer}
</style></head>
<body>
<div class="app">
<div class="header"><div class="logo"><div class="logo-mark"><svg viewBox="0 0 100 120"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D7B65D"/><stop offset="100%" stop-color="#8C6A2F"/></linearGradient></defs><path d="M10 8 L50 108 L90 8 L72 8 L50 56 L28 8 Z" fill="url(#g)"/></svg></div><div class="logo-text">Vzors AI</div></div>
<div class="header-icons"><button class="icon-btn" id="bellBtn"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 7 6 7 6 7H0s6 0 6-7"/><path d="M9 21a3 3 0 0 0 6 0"/></svg></button><button class="icon-btn" id="userBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button></div></div>

<div class="card weather"><img class="weather-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200"><div><div style="font-size:30px;font-weight:700">14°C</div><div style="font-size:13px;color:#5A5A5A">Sunny · Lighthouse right</div><div style="font-size:11px;color:#7A7A7A;margin-top:6px"><div>Calm winds 8 km/h</div><div>Humidity 62%</div><div id="syncInfo" style="color:#C9A87C;font-weight:600;margin-top:4px">● Vzors synced + Meta</div></div></div></div>

<div class="card"><div style="font-weight:700;font-size:16px;margin-bottom:8px">💬 Chat Today — Vzors AI</div><div id="chatList"></div><div class="chat-input"><input id="chatInput" placeholder="Ask Vzors..."><button id="sendBtn">→</button></div></div>

<div class="card"><div class="cal-head"><button>‹</button><span>November 2026</span><button>›</button></div><div class="grid" id="calGrid"></div></div>

<div class="card"><div style="font-weight:700;font-size:17px;margin-bottom:12px">✏️ Notes</div><div class="notes-row" id="notesRow"></div></div>

<div class="bottom"><div class="social"><button class="fb" id="fbBtn">f</button><button class="wa" id="waBtn">W</button></div><button class="plus">+</button><button class="plus">+</button><button class="plus">+</button></div>
</div>

<script>
const META_KEY="LLM_1847717766424548_0N4IxDz9tMeQkkcIcWuT7p5VuI0";
let state=JSON.parse(localStorage.getItem('vzors_final')||'{"chat":[{"role":"user","text":"Explain quantum computing in simple terms"},{"role":"ai","text":"Sure! Think of it as computers using particles that can be 0 and 1 at same time."}],"days":[5,8,12,16,17,19,24,25,29],"notes":[{"id":1,"color":"pink","text":"+ Sticker"},{"id":2,"color":"yellow","text":"+ Sticker"}]}');

async function callMeta(prompt){
  const info=document.getElementById('syncInfo');
  try{
    info.textContent='● Vzors думает...';
    const r=await fetch('https://api.llama.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+META_KEY},
      body:JSON.stringify({model:"Llama-4-Maverick-17B-128E-Instruct-FP8",messages:[{role:"system",content:"You are Vzors AI"},{role:"user",content:prompt}],max_tokens:500})
    });
    const txt=await r.text();
    console.log(txt);
    if(!r.ok) return "Meta error "+r.status+": "+txt.slice(0,300);
    const data=JSON.parse(txt);
    return data.completion_message?.content?.text || data.choices?.[0]?.message?.content || "No answer";
  }catch(e){ info.textContent='● Error: '+e.message; return "Ошибка: "+e.message; }
}

const app={
 save(){localStorage.setItem('vzors_final',JSON.stringify(state)); document.getElementById('syncInfo').textContent='● Vzors synced + Meta';},
 renderChat(){const l=document.getElementById('chatList');l.innerHTML='';state.chat.forEach(c=>{const d=document.createElement('div');d.className='bubble '+(c.role==='user'?'user':'ai');d.textContent=c.text;l.appendChild(d);});},
 async addChat(t){state.chat.push({role:'user',text:t});this.renderChat();this.save();state.chat.push({role:'ai',text:'Vzors думает...'});this.renderChat();const a=await callMeta(t);state.chat.pop();state.chat.push({role:'ai',text:a});this.renderChat();this.save();},
 renderCal(){const g=document.getElementById('calGrid');g.innerHTML='';const h=['','Sun','Mon','Tue','Wed','Thu','Fri','Sat'];h.forEach(x=>{const e=document.createElement('div');e.className=x===''?'':'dow';e.textContent=x;g.appendChild(e);});for(let w=1;w<=5;w++){const wl=document.createElement('div');wl.className='wlabel';wl.textContent='week'+w;g.appendChild(wl);let n=w===5?2:7;for(let d=(w-1)*7+1; d<(w-1)*7+1+n && d<=30; d++){const day=document.createElement('div');day.className='day'+(state.days.includes(d)?' hl':'');day.textContent=d;day.onclick=()=>{if(state.days.includes(d))state.days=state.days.filter(y=>y!==d);else state.days.push(d);app.renderCal();app.save();};g.appendChild(day);}for(let k=0;k<7-n;k++){const e=document.createElement('div');g.appendChild(e);}}}},
 renderNotes(){const r=document.getElementById('notesRow');r.innerHTML='';state.notes.forEach(n=>{const el=document.createElement('div');el.className='sticker '+n.color;el.textContent=n.text;r.appendChild(el);});const mic=document.createElement('button');mic.className='mic';mic.textContent='🎙️';r.appendChild(mic);}
};
document.getElementById('sendBtn').onclick=()=>{const i=document.getElementById('chatInput');if(!i.value.trim())return;app.addChat(i.value);i.value='';};
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('sendBtn').click();});
document.getElementById('fbBtn').onclick=()=>window.open('https://facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href));
document.getElementById('waBtn').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('Vzors AI — '+location.href));
app.renderChat();app.renderCal();app.renderNotes();
</script></body></html>
