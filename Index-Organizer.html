<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VZOR-26 PREMIUM</title>
<style>
body{margin:0;display:flex;height:100vh;font-family:Arial;background:#f5f5f7}
.left,.right{width:50%;padding:20px;box-sizing:border-box}
.left{background:#fff;border-right:1px solid #ddd}
.right{background:#fafafa}
textarea{width:100%;height:80%;border:1px solid #ccc;border-radius:8px;padding:12px}
button{background:#000;color:#fff;padding:10px 15px;border-radius:8px;border:none;cursor:pointer;margin-top:10px}
.badge{background:#000;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<div class="left">
<h2>Smart Notes VZOR <span class="badge">VOICE READY</span></h2>
<textarea id="notes"></textarea>
<button onclick="vzorSpeak()">VOICE</button>
</div>
<div class="right">
<h2>Calendar & Vzors AI</h2>
<p>Connected to VZOR-26 PREMIUM</p>
</div>
<script>
const notes=document.getElementById('notes');
notes.value=localStorage.getItem('vzor-notes')||'';
notes.addEventListener('input',()=>{localStorage.setItem('vzor-notes',notes.value)});
function vzorSpeak(){
const t=notes.value||"VZOR-26 ready";
const u=new SpeechSynthesisUtterance(t);
u.lang='ru-RU';u.rate=0.9;
speechSynthesis.speak(u);
}
</script>
</body>
</html>
