<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>Novembris ir klāt — Vzors AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#f8f7ff;color:#1a1a1a;font-family:Inter,system-ui,sans-serif;padding:24px}
.top{display:flex;align-items:center;gap:16px}
.star{width:56px;height:56px;background:#000;clip-path:polygon(50% 0,61% 35%,98% 50%,61% 65%,50% 100%,39% 65%,2% 50%,39% 35%);display:grid;place-items:center;color:#fff}
h1{margin:0;font-size:40px}
.amethyst{margin:16px 0;background:linear-gradient(135deg,#d6c2ff,#b18cff);border-radius:16px;padding:14px 20px;display:flex;gap:12px;align-items:center}
.amethyst .V{width:34px;height:34px;background:#1a1a1a;color:#fff;border-radius:10px;display:grid;place-items:center;font-weight:800}
.ask-box{background:#fff;border:1px solid #e9e3ff;border-radius:18px;padding:12px 20px;display:flex;gap:10px;align-items:center;margin-bottom:18px}
.ask-box input{flex:1;border:0;outline:0;font-size:15px;background:transparent}
.btn-black{background:#1a1a1a;color:#fff;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:700}
.layout{display:flex;gap:18px}
.left{flex:1}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.sticker{background:#fffbe6;border:1px solid #f0e6b0;border-radius:12px;padding:14px;min-height:100px;box-shadow:2px 4px 12px #00000008;font-size:14px}
.sticker.auto{background:#e9ffef;border-color:#b6e9c5}
.input-area{background:#fff;border:1px solid #e9e3ff;border-radius:18px;padding:16px}
.input-area textarea{width:100%;border:1px solid #ece6ff;border-radius:12px;padding:12px;min-height:80px;resize:none;outline:0;box-sizing:border-box}
.right{width:360px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #e9e3ff;border-radius:18px;padding:18px}
.card h3{margin:0 0 10px 0;font-size:11px;letter-spacing:1.5px;opacity:.6}
.plugin{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f0ff;font-size:13px}
.add-site{display:flex;gap:8px;margin-top:10px}
.add-site input{flex:1;border:1px solid #e9e3ff;border-radius:999px;padding:8px 12px;font-size:12px;outline:0}
</style>
</head>
<body>
<div class="top"><div class="star">✦</div><h1>Novembris ir klāt</h1></div>
<div class="amethyst"><div class="V">V</div><div><b>Vzors AI • Tavs gudrais kolēģis</b></div></div>
<div class="layout">
<div class="left">
<div class="ask-box"><span>✦</span><input id="pastsInput" placeholder="Pasts • Jautā vai ieraksti piezīmi..."><button class="btn-black" onclick="handleAsk()">Runāt</button></div>
<div class="stickers" id="stickers"></div>
<div class="input-area">
<textarea id="freeText" placeholder="Brīvs lauks — raksti vai nodiktē..."></textarea>
<div style="display:flex;gap:10px;margin-top:10px">
<button class="btn-black" onclick="startVoice()">🎤 Nodiktēt</button>
<button style="background:#fff;border:1px solid #e9e3ff;border-radius:999px;padding:10px 20px;cursor:pointer" onclick="saveSticker()">+ Pievienot kā lapiņu</button>
</div>
</div>
</div>
<div class="right">
<div class="card"><h3>✦ VZORS AI • KONTEKSTS</h3><div id="vzorContext" style="font-size:13px;line-height:1.6"></div></div>
<div class="card"><h3>📅 KALENDĀRS UN PASTS</h3><div id="calendarInfo" style="font-size:12px;line-height:1.8"></div></div>
<div class="card">
<h3>🧩 IESPĒJAS • PLUGINS</h3>
<div class="plugin"><span>▶️ YouTube</span><span>● aktīvs</span></div>
<div class="plugin"><span>✏️ Edit Hub</span><span>● aktīvs</span></div>
<div class="plugin"><span>🐙 GitHub</span><span>● aktīvs</span></div>
<div class="plugin"><span>📰 Delfi.lv</span><span>● aktīvs</span></div>
<div class="plugin"><span>🌤️ Laika ziņas</span><span>● aktīvs</span></div>
<div class="plugin"><span>🎤 Balss ievade</span><span>● aktīvs</span></div>
<div class="add-site"><input id="customSite" placeholder="Pievieno saiti..."><button class="btn-black" style="padding:8px 14px" onclick="addSite()">+</button></div>
</div>
</div>
</div>
<script>
const events={"2026-11-08":"Tēva diena","2026-11-11":"Lāčplēša diena","2026-11-18":"Latvijas Republikas proklamēšanas diena"};
const today="2026-11-08";
const stickersEl=document.getElementById('stickers');
const calInfo=document.getElementById('calendarInfo');
const vzorContext=document.getElementById('vzorContext');
function renderAll(){
stickersEl.innerHTML='';calInfo.innerHTML='';
if(events[today]){
let s=document.createElement('div');s.className='sticker auto';s.textContent=events[today];stickersEl.appendChild(s);
calInfo.innerHTML=`${today}: ${events[today]}`;vzorContext.innerText=`Šodien: ${events[today]}.`;
}else{calInfo.innerHTML='Šodien nav notikumu.';vzorContext.innerText='Kalendārs tukšs.'}
let saved=JSON.parse(localStorage.getItem('vzors_stickers')||'[]');
saved.forEach(t=>{let s=document.createElement('div');s.className='sticker';s.textContent=t;stickersEl.appendChild(s);});
}
function saveSticker(){
let v=document.getElementById('freeText').value||document.getElementById('pastsInput').value;if(!v)return;
let saved=JSON.parse(localStorage.getItem('vzors_stickers')||'[]');saved.unshift(v);localStorage.setItem('vzors_stickers',JSON.stringify(saved));
document.getElementById('freeText').value='';document.getElementById('pastsInput').value='';renderAll();
}
function handleAsk(){let q=document.getElementById('pastsInput').value;if(!q)return;vzorContext.innerText=q;saveSticker();}
function startVoice(){
let rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();rec.lang='lv-LV';rec.onresult=e=>{document.getElementById('freeText').value=e.results[0][0].transcript};rec.start();
}
function addSite(){
let v=document.getElementById('customSite').value.trim();if(!v)return;
let icon=v.includes('youtu')?'▶️':v.includes('github')?'🐙':v.includes('edit')?'✏️':'🔗';
let c=document.createElement('div');c.className='plugin';c.innerHTML=`<span>${icon} ${v}</span><span>● pievienots</span>`;
document.querySelectorAll('.card')[2].insertBefore(c,document.querySelector('.add-site'));document.getElementById('customSite').value='';
}
renderAll();
</script>
</body>
</html>
