<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VZOR-26</title>
<style>
body{margin:0;display:flex;min-height:100vh;font-family:system-ui;background:#f5f5f7}
.left{width:50%;background:#fff;padding:24px;border-right:1px solid #e5e5e5}
.right{width:50%;background:#fafafa;padding:24px}
textarea{width:100%;height:70vh;border:1px solid #d1d1d1;border-radius:10px;padding:12px;font-size:15px;box-sizing:border-box}
.btn{background:#000;color:#fff;border:0;padding:12px 18px;border-radius:10px;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="left">
<h2>VZOR Smart Notes</h2>
<textarea id="n" placeholder="Напиши заметку..."></textarea>
<button class="btn" onclick="speak()">VOICE</button>
</div>
<div class="right">
<h2>Calendar</h2>
<p>VZOR-26 PREMIUM Active</p>
</div>
<script>
const el=document.getElementById('n');
el.value=localStorage.getItem('vzor')||'';
el.oninput=()=>localStorage.setItem('vzor',el.value);
function speak(){
let t=el.value||'VZOR готов';
let u=new SpeechSynthesisUtterance(t);
u.lang='ru-RU';u.rate=0.9;
speechSynthesis.speak(u);
}
</script>
</body>
</html>
