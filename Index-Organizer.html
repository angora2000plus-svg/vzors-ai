<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>VZOR-26 PREMIUM - Smart Organizer</title>
<style>
body { background:#0a0a0a; color:#00ffcc; font-family: monospace; padding:30px; }
.card { border:2px solid #00ffcc; padding:20px; border-radius:15px; max-width:600px; }
button { background:#00ffcc; color:#000; padding:12px 20px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:15px; font-size:16px; }
#log { margin-top:15px; color:#fff; }
</style>
</head>
<body>
<div class="card">
<h1>VZOR-26 PREMIUM</h1>
<p>AI Core: Online (Voice Ready)</p>
<div id="log">Задачи загружены из emails.txt</div>
<button onclick="speakVzor()">🔊 ЗАСТАВИТЬ ВЗОР ГОВОРИТЬ</button>
<button onclick="readTasks()">📋 Прочитать задачи</button>
</div>

<script>
const tasks = [
  "Привет, Спарки! Я ВЗОР.",
  "Я готов к защите.",
  "Задачи синхронизированы.",
  "Система в порядке."
];

function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 0.9;
  u.pitch = 1;
  window.speechSynthesis.speak(u);
}

function speakVzor() {
  speak("Привет, Спарки! Я Взор двадцать шесть премиум. Я научился говорить. Все системы в порядке. Готов к защите диплома.");
  document.getElementById('log').innerHTML = "VZOR говорит... 🔊";
}

function readTasks() {
  speak("Слушай задачи. Проверить батарею. Подготовить презентацию. Защита диплома двадцать двадцать шесть.");
  document.getElementById('log').innerHTML = "TASK: Check battery<br>TASK: Prepare presentation";
}
</script>
</body>
</html>
